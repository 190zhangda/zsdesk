name: Windows installer

# 产出 Inno Setup 安装包（写入注册表的标准安装程序），而非便携版 exe。
# 触发方式：
#   - push 标签 v*（如 v0.3.11）→ 打包并自动创建 GitHub Release
#   - workflow_dispatch       → 手动打包，仅上传 Artifact
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      editions:
        description: '逗号分隔的版本，如 full,desktop-box'
        default: 'full'
        required: false

permissions:
  contents: write   # 创建 Release 需要；仅打 Artifact 时可降为 read

jobs:
  installer:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EDITIONS: ${{ github.event.inputs.editions || 'full' }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: zsdesk
      - name: Read the ZSUI revision
        id: zsui
        shell: pwsh
        run: '"revision=$((Get-Content -LiteralPath zsdesk/packaging/zsui-revision.txt -Raw).Trim())" >> $env:GITHUB_OUTPUT'
      # package.ps1 要求 zsui 与 zsdesk 是兄弟目录（构建会 remap 它的路径）
      - uses: actions/checkout@v7
        with:
          repository: qiu7824/zsui
          ref: ${{ steps.zsui.outputs.revision }}
          path: zsui
      - name: Read the workspace version
        id: meta
        shell: pwsh
        run: |
          $v=[regex]::Match((Get-Content -LiteralPath zsdesk/Cargo.toml -Raw),'(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress
      - name: Fetch pinned Everything runtime
        # package.ps1 会校验 Everything.exe/lng/License 与 packaging/engines/everything.json
        # 的 sha256，并要求 manifest.json 与 everything.json 内容一致（即哈希相同）。
        # 注意：完成“移除 Everything、改用 Listary”的改造后，整个 step 删除即可。
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path everything | Out-Null
          Invoke-WebRequest -Uri 'https://www.voidtools.com/Everything-1.4.1.1032.x64.zip' -OutFile everything.zip
          Expand-Archive -Path everything.zip -DestinationPath everything
          Copy-Item zsdesk/packaging/engines/everything.json everything/manifest.json
      - name: Package payloads and compile installers
        shell: pwsh
        run: >
          ./zsdesk/scripts/package.ps1
          -Editions ($env:EDITIONS -split ',')
          -EverythingDir "$PWD/everything"
          -InnoCompiler 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          -OutputDir "$PWD/out"
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZSDesk-${{ steps.meta.outputs.version }}-setup
          path: out/**/*-setup.exe
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/**/*-setup.exe
