name: Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      editions:
        description: '逗号分隔的版本，如 full,desktop-box'
        default: 'full'
        required: false

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EDITIONS: ${{ github.event.inputs.editions || 'full' }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: zsdesk

      - name: Read ZSUI revision
        id: zsui
        shell: pwsh
        run: '"revision=$((Get-Content -LiteralPath zsdesk/packaging/zsui-revision.txt -Raw).Trim())" >> $env:GITHUB_OUTPUT'
      - uses: actions/checkout@v7
        with:
          repository: qiu7824/zsui
          ref: ${{ steps.zsui.outputs.revision }}
          path: zsui

      - name: Read version from Cargo.toml
        id: meta
        shell: pwsh
        run: |
          $m = [regex]::Match((Get-Content -LiteralPath zsdesk/Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"')
          if (-not $m.Success) { throw "Cargo.toml 未找到 version" }
          "version=$($m.Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@1.99.0

      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress

      # ---- Everything 运行时（必须保留，不要删）----
      - name: Fetch pinned Everything runtime
        id: everything
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path everything_raw -Force | Out-Null
          Invoke-WebRequest -Uri 'https://www.voidtools.com/Everything-1.4.1.1032.x64.zip' -OutFile everything.zip -UseBasicParsing
          Expand-Archive -Path everything.zip -DestinationPath everything_raw -Force

          # 自动定位 Everything.exe 真实目录
          $exe = Get-ChildItem -Path everything_raw -Recurse -Filter Everything.exe | Select-Object -First 1
          if (-not $exe) { throw "解压后找不到 Everything.exe" }
          $realDir = $exe.DirectoryName

          # 平铺到 everything/ 目录
          New-Item -ItemType Directory -Path everything -Force | Out-Null
          Copy-Item -Path "$realDir\*" -Destination everything\ -Recurse -Force

          # 拷贝校验清单（必须与 everything.json 哈希一致）
          Copy-Item zsdesk/packaging/engines/everything.json everything/manifest.json -Force

          Remove-Item everything.zip, everything_raw -Recurse -Force
          "dir=$PWD/everything" >> $env:GITHUB_OUTPUT

      # ---- 编译 + 打包 + 出安装包 ----
      - name: Package and compile installer
        shell: pwsh
        run: >
          ./zsdesk/scripts/package.ps1
          -Editions ($env:EDITIONS -split ',')
          -EverythingDir "${{ steps.everything.outputs.dir }}"
          -InnoCompiler 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          -OutputDir "$PWD/out"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZSDesk-${{ steps.meta.outputs.version }}-setup
          path: out/**/*-setup.exe
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/**/*-setup.exe
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
