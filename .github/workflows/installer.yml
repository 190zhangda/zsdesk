name: Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      editions:
        description: '逗号分隔的版本，如 full,desktop-box'
        default: 'full'
        required: false

permissions:
  contents: write   # 创建 Release 需要

jobs:
  installer:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EDITIONS: ${{ github.event.inputs.editions || 'full' }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: zsdesk

      - name: Read ZSUI revision
        id: zsui
        shell: pwsh
        run: '"revision=$((Get-Content -LiteralPath zsdesk/packaging/zsui-revision.txt -Raw).Trim())" >> $env:GITHUB_OUTPUT'
      - uses: actions/checkout@v7
        with:
          repository: qiu7824/zsui
          ref: ${{ steps.zsui.outputs.revision }}
          path: zsui

      - name: Read version from Cargo.toml
        id: meta
        shell: pwsh
        run: |
          $raw = Get-Content -LiteralPath zsdesk/Cargo.toml -Raw
          $m = [regex]::Match($raw, '(?m)^version\s*=\s*"([^"]+)"')
          if (-not $m.Success) { throw "Cargo.toml 里没读到 version" }
          "version=$($m.Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@1.99.0

      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress

      # ---- Everything 运行时（保留，不要删）----
      - name: Fetch pinned Everything runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path everything -Force | Out-Null
          Invoke-WebRequest -Uri 'https://www.voidtools.com/Everything-1.4.1.1032.x64.zip' -OutFile everything.zip -UseBasicParsing
          Expand-Archive -Path everything.zip -DestinationPath everything -Force
          # 找真正包含 Everything.exe 的子目录，把 manifest 放对位置
          $exeDir = Get-ChildItem -Path everything -Recurse -Filter Everything.exe | Select-Object -First 1 | ForEach-Object { $_.DirectoryName }
          if (-not $exeDir) { throw "解压后找不到 Everything.exe" }
          Copy-Item zsdesk/packaging/engines/everything.json "$exeDir/manifest.json" -Force
          "everything_dir=$exeDir" >> $env:GITHUB_OUTPUT
        id: everything

      # ---- 打包 + 编译安装包 ----
      - name: Package and compile installer
        shell: pwsh
        run: >
          ./zsdesk/scripts/package.ps1
          -Editions ($env:EDITIONS -split ',')
          -EverythingDir "${{ steps.everything.outputs.everything_dir }}"
          -InnoCompiler 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          -OutputDir "$PWD/out"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZSDesk-${{ steps.meta.outputs.version }}-setup
          path: out/**/*-setup.exe
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/**/*-setup.exe
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
