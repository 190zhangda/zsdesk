name: Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      editions:
        description: '逗号分隔的版本，如 full,desktop-box'
        default: 'full'
        required: false

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EDITIONS: ${{ github.event.inputs.editions || 'full' }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: zsdesk
          
      - name: Read the ZSUI revision
        id: zsui
        shell: pwsh
        run: '"revision=$((Get-Content -LiteralPath zsdesk/packaging/zsui-revision.txt -Raw).Trim())" >> $env:GITHUB_OUTPUT'
      
      - uses: actions/checkout@v7
        with:
          repository: qiu7824/zsui
          ref: ${{ steps.zsui.outputs.revision }}
          path: zsui
          
      - name: Read the workspace version
        id: meta
        shell: pwsh
        run: |
          $v=[regex]::Match((Get-Content -LiteralPath zsdesk/Cargo.toml -Raw),'(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          
      - uses: dtolnay/rust-toolchain@1.99.0
      
      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress
        
      # ========== 彻底修复的 Everything 准备步骤 ==========
      - name: Fetch Everything runtime (Ultimate Fix)
        shell: pwsh
        run: |
          # 1. 创建目标目录
          New-Item -ItemType Directory -Path everything -Force | Out-Null
          
          # 2. 直接下载官方纯净的 Everything.exe (免压缩包，不会被拦截)
          Invoke-WebRequest -Uri 'https://www.voidtools.com/Everything-1.4.1.1032.x64.exe' -OutFile everything/Everything.exe -UseBasicParsing
          
          # 3. 【关键】直接从仓库源码拷贝 License.txt (官方压缩包里没有！)
          Copy-Item zsdesk/packaging/engines/License.txt everything/License.txt -Force
          
          # 4. 复制仓库要求的校验清单（manifest.json 必须与 everything.json 哈希一致）
          Copy-Item zsdesk/packaging/engines/everything.json everything/manifest.json -Force
          
          # 5. 打印目录内容用于调试确认
          Write-Host "Everything dir contents:"
          Get-ChildItem everything
          
      # ========== 编译与打包 ==========
      - name: Package payloads and compile installers
        shell: pwsh
        run: >
          ./zsdesk/scripts/package.ps1
          -Editions ($env:EDITIONS -split ',')
          -EverythingDir "$PWD/everything"
          -InnoCompiler 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          -OutputDir "$PWD/out"
          
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZSDesk-${{ steps.meta.outputs.version }}-setup
          path: out/**/*-setup.exe
          if-no-files-found: error
          
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/**/*-setup.exe
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
