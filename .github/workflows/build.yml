name: Windows build

on:
  push:
    tags:
      - "v*"          # 只有打 v 开头的 tag 才触发 Release 发布
  pull_request:
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write     # 需要写权限才能创建 Release

jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          path: zsdesk
      - name: Read the ZSUI revision
        id: dependency
        shell: pwsh
        run: '"revision=$((Get-Content -LiteralPath zsdesk/packaging/zsui-revision.txt -Raw).Trim())" >> $env:GITHUB_OUTPUT'
      - uses: actions/checkout@v7
        with:
          repository: qiu7824/zsui
          ref: ${{ steps.dependency.outputs.revision }}
          path: zsui
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Test
        working-directory: zsdesk
        run: cargo test --workspace --release --locked
      - name: Check all editions
        working-directory: zsdesk
        shell: pwsh
        run: |
          cargo check --locked --release -p zsdesk-app --no-default-features
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo check --locked --release -p zsdesk-app --no-default-features --features network
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo check --locked --release -p zsdesk-app --no-default-features --features desktop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --release -p zsdesk-app
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo check --locked --release -p zsdesk-app --no-default-features --features themed
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo check --locked --release -p zsdesk-app --no-default-features --features desktop-box
          exit $LASTEXITCODE
      - name: Test theme and desktop-only editions
        working-directory: zsdesk
        shell: pwsh
        run: |
          cargo test --locked --release -p zsdesk-app --no-default-features --features themed
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --release -p zsdesk-app --no-default-features --features desktop-box
          exit $LASTEXITCODE

      # ========== 新增部分从这里开始 ==========

      - name: 确定产物路径
        id: artifact
        shell: pwsh
        run: |
          # 默认 target 路径
          $targetDir = "zsdesk/target/release"
          Write-Host "Looking for zsdesk-app.exe in $targetDir"
          if (Test-Path "$targetDir/zsdesk-app.exe") {
            echo "exe_path=$targetDir/zsdesk-app.exe" >> $env:GITHUB_OUTPUT
            echo "dir=$targetDir" >> $env:GITHUB_OUTPUT
          } else {
            # 如果用了 CARGO_TARGET_DIR 环境变量，路径可能不同
            $altDir = "target/release"
            if (Test-Path "$altDir/zsdesk-app.exe") {
              echo "exe_path=$altDir/zsdesk-app.exe" >> $env:GITHUB_OUTPUT
              echo "dir=$altDir" >> $env:GITHUB_OUTPUT
            } else {
              throw "找不到编译产物 zsdesk-app.exe"
            }
          }

      - name: 上传编译产物（供下载测试）
        uses: actions/upload-artifact@v4
        with:
          name: zsdesk-windows-x64
          path: |
            ${{ steps.artifact.outputs.dir }}/zsdesk-app.exe
            ${{ steps.artifact.outputs.dir }}/*.dll
          if-no-files-found: error

      - name: 创建/更新 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifact.outputs.dir }}/zsdesk-app.exe
            ${{ steps.artifact.outputs.dir }}/*.dll
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
